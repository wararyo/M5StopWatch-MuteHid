[platformio]
default_envs = m5stopwatch-coexist

[env]
platform = espressif32 @ 6.12.0
framework = espidf
board = m5stack-cores3
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  m5stack/M5Unified @ 0.2.16
  m5stack/M5GFX @ 0.2.28
build_flags =
  -DBOARD_HAS_PSRAM
  -Wno-error=maybe-uninitialized
extra_scripts =
  pre:tools/icons.py
  pre:tools/upload_guard.py
  pre:tools/pio_flash.py

[env:m5stopwatch-coexist]
; Target for -t update: 1, 2, or 3 (same firmware for every slot).
custom_app_slot = 1
board_build.partitions = partitions.coexist.csv
build_flags = ${env.build_flags} -DMUTEHID_COEXIST=1

[env:m5stopwatch]
board_build.partitions = partitions.csv
build_flags = ${env.build_flags} -DMUTEHID_COEXIST=0

